version: '3.4'

services:
  api.gateway:
    image: ${DOCKER_REGISTRY-}apigateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    ports: 
        - 7000:80
    build:
      context: .
      dockerfile: API.Gateway/Dockerfile
    networks:
        - ellyshop_gateway_network
  
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: elly_sqlserver
    ports:
      - "1530:1433"
    environment:
      MSSQL_SA_PASSWORD: "@Locdeptrai123456"
      ACCEPT_EULA: "Y"
    networks:
      - elly_db_network
    volumes:
      - sql_data:/var/opt/mssql

  frontend:
    image: ${DOCKER_REGISTRY-}frontend
    ports:
        - 80:80
    # volumes:
    #     - /path/in/host/machine:/usr/src/app  
    build:
      context: .
      dockerfile: FrontEnd/Dockerfile
      target: Production
      args:
        REACT_APP_BASE_API_URL: "https://lemayo.io.vn/api/"
        REACT_APP_GOOGLE_OAUTH_CLIENT_ID: ${REACT_APP_GOOGLE_OAUTH_CLIENT_ID}
        REACT_APP_FACEBOOK_OAUTH_APP_ID: ${REACT_APP_FACEBOOK_OAUTH_APP_ID}
    networks:
        - ellyshop_gateway_network
  
  user.api:
    image: ${DOCKER_REGISTRY-}userapi
    ports:
        - 7135:80
    hostname: elly.user
    build:
      context: .
      dockerfile: User.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
        - ellyshop_gateway_network
        - elly_db_network

  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    ports:
        - 7021:80
    hostname: elly.catalog
    environment:
      - ASPNETCORE_ENVIRONMENT=Production      
    build:
      context: .
      dockerfile: Category.Api/Dockerfile
    networks:
        - ellyshop_gateway_network
        - elly_db_network

  content.api:
     image: ${DOCKER_REGISTRY-}contentapi
     ports:
        - 7022:80
     hostname: elly.content
     environment:
        - ASPNETCORE_ENVIRONMENT=Production    
     build:
        context: .
        dockerfile: ContentManagement.Api/Dockerfile
     networks:
        - ellyshop_gateway_network
        - elly_db_network

networks:
  ellyshop_gateway_network:
    external: true
  elly_db_network:
    external: true

volumes:
  sql_data:
